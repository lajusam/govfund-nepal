[package]
name = "govfund"
version = "0.1.0"
description = "Decentralized Government Fund Transparency System for Nepal"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "govfund"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
